<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hush time 색감 비교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 안내 + 팔레트 전환 버튼 + 휴대폰 목업(한 개 또는 나란히 4개).
   목업 안의 색은 모두 아래 스크립트의 PALETTES에서 --bg, --surface 같은 변수로 주입한다.
   상단 일러스트는 실제 앱 이미지를 불러와 팔레트 색으로 다시 칠한다. 이 페이지 자체는 어두운 단일 톤. */
:root {
  color-scheme: dark;
  --ink-bg: #0d1017;
  --ink-fg: #e7e9ed;
  --ink-sub: #9aa3b1;
  --ink-line: #262d3a;
  --ink-chip: #171c26;
  --font: "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--ink-bg); }
body {
  margin: 0;
  background: var(--ink-bg);
  color: var(--ink-fg);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(28px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px));
}
.page { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; text-wrap: balance; }
.lead { margin: 0; color: var(--ink-sub); max-width: 62ch; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.seg-group { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  font: inherit; font-weight: 500; font-size: 14px;
  color: var(--ink-fg); background: var(--ink-chip);
  border: 1px solid var(--ink-line); border-radius: 999px;
  padding: 8px 16px; cursor: pointer;
}
.btn:hover { border-color: var(--ink-sub); }
.btn[aria-pressed="true"] { background: var(--ink-fg); color: var(--ink-bg); border-color: var(--ink-fg); }
.btn:focus-visible { outline: 2px solid var(--ink-fg); outline-offset: 2px; }
.spacer { flex: 1 1 24px; }

.stage { display: flex; flex-wrap: wrap; justify-content: center; gap: 36px 28px; }
.fig { margin: 0; width: min(390px, 100%); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.cap strong { font-size: 17px; }
.cap p { margin: 2px 0 0; color: var(--ink-sub); font-size: 13.5px; }
.chips { display: flex; gap: 6px 12px; margin-top: 8px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-sub); }
.chip i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); display: block; }
.foot { color: var(--ink-sub); font-size: 13px; margin: 0; max-width: 62ch; }

/* ---------- 휴대폰 목업 ---------- */
.phone {
  position: relative; width: 100%; height: 800px; overflow: hidden;
  background: var(--bg); color: var(--text);
  border-radius: 38px; border: 1px solid var(--ink-line);
  display: flex; flex-direction: column;
}
.top { position: relative; height: 118px; flex: none; }
.top canvas { position: absolute; left: 0; bottom: 0; width: 100%; height: auto; display: block; }
.time { position: absolute; left: 26px; top: 14px; font-weight: 700; font-size: 15px; color: #fff; }
.island { position: absolute; left: 50%; top: 9px; width: 104px; height: 30px; margin-left: -52px; border-radius: 20px; background: #000; }
.tools { position: absolute; right: 12px; bottom: 6px; display: flex; gap: 8px; }
.tools span { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; color: #fff; }

.player {
  flex: none; height: 252px; padding: 12px; color: #fff;
  display: flex; flex-direction: column; gap: 12px;
}
.p-head { display: flex; align-items: center; gap: 10px; }
.p-head .dot { width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.4); display: grid; place-items: center; font-size: 14px; letter-spacing: 1px; flex: none; }
.p-head .avatar { width: 36px; height: 36px; border-radius: 50%; background: #1f3a46; border: 1px solid rgba(255,255,255,.25); flex: none; }
.p-head .meta { min-width: 0; flex: 1; }
.p-head b { display: block; font-size: 17px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.p-head small { font-size: 13px; opacity: .92; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.p-ctrl { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.round { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: rgba(0,0,0,.38); color: #fff; }
.round.a { border: 2px solid var(--asmr); }
.round.c { border: 2px solid var(--calm); }
.play { width: 70px; height: 48px; border-radius: 13px; background: #d3131d; display: grid; place-items: center; }
.p-bot { margin-top: auto; display: flex; align-items: center; gap: 10px; }
.seg { display: flex; background: rgba(58,58,58,.9); border-radius: 999px; padding: 3px; font-weight: 700; font-size: 14px; flex: none; }
.seg span { padding: 5px 13px; border-radius: 999px; color: #a9a9a9; }
.seg .on { background: #fff; color: #000; }
.bar { flex: 1; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; position: relative; min-width: 20px; }
.bar::before { content: ""; position: absolute; left: 0; top: -5px; width: 13px; height: 13px; border-radius: 50%; background: #fff; }
.tm { font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; text-shadow: 0 1px 3px rgba(0,0,0,.6); }

.cols { flex: none; display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-bottom: 1px solid var(--line); }
.cols div { text-align: center; padding: 11px 0; font-weight: 700; font-size: 19px; }
.cols .a { color: var(--asmr); }
.cols .c { color: var(--calm); }
.grid { display: grid; grid-template-columns: 1fr 1fr; background: var(--high); }
.cell { padding: 10px 9px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.cell:nth-child(2n) { border-right: 0; }
.thumb { aspect-ratio: 16 / 9; border-radius: 2px; background-size: cover; background-position: center; background-color: #222; }
.cell p { margin: 8px 2px 0; font-size: 15.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabbar {
  position: absolute; left: 14px; right: 14px; bottom: 14px; height: 66px;
  background: var(--tab); border-radius: 999px; padding: 5px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 999px; font-size: 11.5px; color: var(--text); }
.tab.on { background: var(--tabsel); color: var(--tabseltext); }

@media (max-width: 440px) {
  .phone { border-radius: 28px; }
  h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>hush time 색감 비교</h1>
    <p class="lead">같은 메인 화면에 색만 다르게 입혔습니다. 아래 버튼을 눌러 바꿔 보시고, 눈이 가장 편안한 쪽을 알려 주세요.</p>
  </header>

  <div class="controls">
    <div class="seg-group" id="switcher" role="group" aria-label="팔레트 선택"></div>
    <span class="spacer"></span>
    <button class="btn" id="compare" type="button" aria-pressed="false">나란히 보기</button>
  </div>

  <div class="stage" id="stage"></div>

  <p class="foot">썸네일과 상단 일러스트는 실제 앱 화면의 이미지입니다. 영상 썸네일은 색이 제각각이라, 바탕색이 그 사이에서 얼마나 차분하게 받쳐 주는지를 봐 주세요.</p>
</div>

function lum(hex) {
  var n = parseInt(hex.slice(1), 16), ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  var v = ch.map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
function ratio(a, b) {
  var x = lum(a), y = lum(b), hi = Math.max(x, y), lo = Math.min(x, y);
  return ((hi + 0.05) / (lo + 0.05)).toFixed(1);
}

function prepareBase() {

  };
}

  var c = p.c, out = cx.createImageData(hdrBase.w, hdrBase.h);
  var tree = hex2rgb(c.tree), moon = hex2rgb(c.moon), s1 = hex2rgb(c.sky1), s2 = hex2rgb(c.sky2);
  var ls = hdrBase.skyLum, src = hdrBase.px, dst = out.data;
  for (var y = 0; y < hdrBase.h; y++) {
    var sky = mix(s1, s2, y / (hdrBase.h - 1));
    for (var x = 0; x < hdrBase.w; x++) {
      var i = (y * hdrBase.w + x) * 4;
      var L = 0.2126 * src[i] + 0.7152 * src[i + 1] + 0.0722 * src[i + 2];
      var col = L < ls ? mix(tree, sky, L / ls) : mix(sky, moon, Math.min(1, (L - ls) / (255 - ls)));
      dst[i] = col[0]; dst[i + 1] = col[1]; dst[i + 2] = col[2]; dst[i + 3] = 255;
    }
  }
  cx.putImageData(out, 0, 0);
  top.style.background = c.sky1;
}

function paintHeaders() {
  if (!hdrReady) return;
  var list = document.querySelectorAll("canvas.hdr");
  for (var i = 0; i < list.length; i++) {
    try { paintHeader(list[i]); } catch (e) { list[i].getContext("2d").drawImage(hdrImg, 0, 0, 780, 178); }
  }
}

hdrImg.onload = function () {
  try { prepareBase(); } catch (e) { hdrBase = null; }
  hdrReady = true;
  paintHeaders();
};
hdrImg.src = IMAGES.header;

function render() {
  var sw = document.getElementById("switcher");
  sw.innerHTML = PALETTES.map(function (p) {
    return '<button type="button" class="btn" data-id="' + p.id + '" aria-pressed="' + (!state.compare && state.sel === p.id) + '">' + p.name + "</button>";
  }).join("");
  document.getElementById("compare").setAttribute("aria-pressed", String(state.compare));
  var list = state.compare ? PALETTES : PALETTES.filter(function (p) { return p.id === state.sel; });
  document.getElementById("stage").innerHTML = list.map(figure).join("");
  paintHeaders();
  try { history.replaceState(null, "", "#" + (state.compare ? "compare" : state.sel)); } catch (e) {}
}

document.getElementById("switcher").addEventListener("click", function (e) {
  var b = e.target.closest("button[data-id]");
  if (!b) return;
  state.sel = b.getAttribute("data-id");
  state.compare = false;
  render();
});
document.getElementById("compare").addEventListener("click", function () {
  state.compare = !state.compare;
  render();
});

(function init() {
  var h = location.hash.slice(1);
  if (h === "compare") state.compare = true;
  else if (PALETTES.some(function (p) { return p.id === h; })) state.sel = h;
  render();
})();
</script>
</body>
</html>
